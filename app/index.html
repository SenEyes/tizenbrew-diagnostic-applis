<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Diagnostic applis TV</title>
<style>
  /* Moteur de la TV : Chrome 69 sur Tizen 5.5. Pas de gap en flexbox, d'aspect-ratio ni de backdrop-filter. */
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d12; color: #e8eaf0; font-family: Arial, Helvetica, sans-serif; }
  #top { position: absolute; left: 80px; top: 36px; width: 1760px; }
  h1 { margin: 0; font-size: 44px; font-weight: bold; }
  #version { margin-left: 14px; font-size: 26px; font-weight: normal; color: #8a93a8; }
  #stats { margin-top: 14px; font-size: 26px; line-height: 36px; color: #c4cad8; }
  #stats b { color: #ffffff; }
  #message { display: none; position: absolute; left: 80px; top: 950px; width: 1760px; padding: 10px 20px; border-radius: 12px; box-sizing: border-box; font-size: 24px; line-height: 32px; background: #4a1d24; color: #ffd7dc; }
  #tools { position: absolute; left: 80px; top: 236px; width: 1760px; height: 56px; }
  .btn { float: left; margin-right: 20px; padding: 10px 28px; border-radius: 28px; font-size: 24px; line-height: 30px; background: #232a3a; border: 3px solid #232a3a; }
  .btn.focus { background: #f2f4f8; color: #0b0d12; border-color: #ffffff; }
  #list { position: absolute; left: 80px; top: 316px; width: 1760px; height: 624px; overflow: hidden; }
  .row { position: relative; height: 96px; margin-bottom: 8px; border-radius: 16px; background: #141925; border: 3px solid #141925; box-sizing: border-box; }
  .row.focus { background: #253047; border-color: #8fb4ff; }
  .icon { position: absolute; left: 20px; top: 9px; width: 72px; height: 72px; border-radius: 12px; background: #2c3446; }
  .name { position: absolute; left: 116px; top: 8px; width: 860px; font-size: 30px; line-height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .id { position: absolute; left: 116px; top: 50px; width: 860px; font-size: 22px; line-height: 30px; color: #8a93a8; font-family: 'Courier New', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result { position: absolute; left: 1000px; top: 28px; width: 540px; font-size: 24px; line-height: 34px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c4cad8; }
  .result.ok { color: #7ee2a8; }
  .result.ko { color: #ff8a8a; }
  .go { position: absolute; right: 20px; top: 20px; padding: 8px 26px; border-radius: 26px; font-size: 24px; line-height: 34px; background: #2c3446; }
  .row.focus .go { background: #f2f4f8; color: #0b0d12; }
  .hidden-app .name { color: #9aa3b5; }
  .empty { padding: 20px; font-size: 28px; color: #8a93a8; }
  #help { position: absolute; left: 80px; top: 1010px; width: 1760px; font-size: 22px; color: #8a93a8; }
</style>
</head>
<body>
<div id="top">
  <h1>Diagnostic des applis<span id="version"></span></h1>
  <div id="stats">Connexion au service du module…</div>
</div>
<div id="tools"></div>
<div id="list"></div>
<div id="message"></div>
<div id="help"></div>
<script>
(function () {
  'use strict';

  var VERSION = '0.1.0';
  var PAGE = 6;
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, ESCAPE: 27 };
  var SERVICE = serviceUrl();
  var readyAt = Date.now();
  var navigationStart = window.performance && performance.timing ? performance.timing.navigationStart : 0;

  var st = {
    token: null,
    info: null,
    apps: null,
    shown: [],
    showAll: false,
    zone: 'list',
    row: 0,
    top: 0,
    tool: 0,
    results: {},
    busy: false
  };

  function $(id) { return document.getElementById(id); }

  // Paramètre réservé aux tests : un autre port du service, toujours sur la machine elle-même.
  function serviceUrl() {
    var m = /[?&]service=(http:\/\/127\.0\.0\.1:\d+)(&|$)/.exec(location.search);
    return m ? m[1] : 'http://127.0.0.1:8097';
  }

  function request(method, path, body, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, SERVICE + path, true);
    xhr.timeout = 20000;
    if (method === 'POST') {
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('X-Diag-Token', st.token || '');
    }
    xhr.onload = function () {
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      if (xhr.status >= 200 && xhr.status < 300) { return done(null, data); }
      done((data && data.error) || ('Erreur HTTP ' + xhr.status + '.'), data);
    };
    xhr.onerror = function () { done('Service du module injoignable (' + SERVICE + ').', null); };
    xhr.ontimeout = function () { done('Le service du module ne répond pas.', null); };
    xhr.send(body ? JSON.stringify(body) : null);
  }

  /* ---------- Mise en forme ---------- */

  function escapeHtml(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function seconds(ms) {
    if (ms === null || ms === undefined) { return 'non mesuré'; }
    return (ms / 1000).toFixed(1).replace('.', ',') + ' s';
  }

  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function clock(timestamp) {
    var d = new Date(timestamp);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function showMessage(text) {
    var box = $('message');
    box.textContent = text;
    box.style.display = 'block';
  }

  /* ---------- Affichage ---------- */

  function tools() {
    var lanOpen = !!(st.info && st.info.lan && st.info.lan.open);
    return [
      { label: st.showAll ? 'Afficher : les applis visibles' : 'Afficher : toutes les entrées', run: toggleAll },
      { label: 'Relire la liste', run: function () { loadApps(true); } },
      { label: lanOpen ? "Fermer l'accès PC" : "Rouvrir l'accès PC (30 min)", run: toggleLan }
    ];
  }

  function renderStats() {
    var lines = [];
    var apps = st.apps;
    if (!apps) {
      lines.push('Lecture de la liste des applis…');
    } else if (apps.error) {
      lines.push('Liste des applis : <b>échec</b>, ' + escapeHtml(apps.error));
    } else {
      lines.push('Applis visibles : <b>' + apps.visible + '</b> sur ' + apps.count + ' entrées · liste lue en <b>' + seconds(apps.ms) + '</b>' +
        (st.info && st.info.platform ? ' · Tizen ' + escapeHtml(st.info.platform) : ''));
    }
    var t = st.info && st.info.timings;
    if (t && t.tizenbrewToModuleMs !== null && t.tizenbrewToModuleMs !== undefined) {
      if (t.tizenbrewToModuleMs <= 120000) {
        lines.push("Ouverture de TizenBrew jusqu'au module : <b>" + seconds(t.tizenbrewToModuleMs) + '</b> · chargement de la page : <b>' + seconds(t.pageLoadMs) + '</b>');
      } else {
        lines.push("TizenBrew était déjà ouvert : délai d'ouverture non mesurable · chargement de la page : <b>" + seconds(t.pageLoadMs) + '</b>');
      }
    }
    var lan = st.info && st.info.lan;
    if (lan) {
      if (lan.open) {
        var address = lan.addresses && lan.addresses.length ? lan.addresses[0] : 'adresse-de-la-TV';
        lines.push("Accès depuis le PC : <b>ouvert jusqu'à " + clock(lan.until) + '</b> · http://' + escapeHtml(address) + ':' + lan.port + '/rapport');
      } else {
        lines.push('Accès depuis le PC : <b>fermé</b>' + (lan.error ? ' (' + escapeHtml(lan.error) + ')' : ''));
      }
    }
    $('stats').innerHTML = lines.join('<br>');
  }

  function renderTools() {
    var list = tools();
    var html = '';
    for (var i = 0; i < list.length; i++) {
      html += '<div class="btn' + (st.zone === 'tools' && st.tool === i ? ' focus' : '') + '">' + escapeHtml(list[i].label) + '</div>';
    }
    $('tools').innerHTML = html;
  }

  function resultHtml(r) {
    if (!r) { return '<div class="result"></div>'; }
    if (r.pending) { return '<div class="result">Lancement…</div>'; }
    if (r.ok) { return '<div class="result ok">Appel accepté en ' + r.ms + ' ms</div>'; }
    return '<div class="result ko">Échec : ' + escapeHtml(r.error || 'inconnu') + '</div>';
  }

  // Seules les lignes visibles sont dessinées : la TV peut annoncer plus de 350 entrées.
  function renderList() {
    var box = $('list');
    if (!st.shown.length) {
      box.innerHTML = st.apps ? '<div class="empty">Aucune entrée à afficher.</div>' : '';
      return;
    }
    if (st.row < st.top) { st.top = st.row; }
    if (st.row >= st.top + PAGE) { st.top = st.row - PAGE + 1; }
    var html = '';
    var end = Math.min(st.shown.length, st.top + PAGE);
    for (var i = st.top; i < end; i++) {
      var app = st.shown[i];
      var focused = st.zone === 'list' && st.row === i;
      html += '<div class="row' + (focused ? ' focus' : '') + (app.show ? '' : ' hidden-app') + '">' +
        (app.icon
          ? '<img class="icon" src="' + SERVICE + '/icone?id=' + encodeURIComponent(app.id) + '" alt="" onerror="this.style.visibility=\'hidden\'">'
          : '<div class="icon"></div>') +
        '<div class="name">' + escapeHtml(app.name || '(sans nom)') + '</div>' +
        '<div class="id">' + escapeHtml(app.id) + (app.show ? '' : ' (cachée des menus)') + '</div>' +
        resultHtml(st.results[app.id]) +
        '<div class="go">Lancer</div></div>';
    }
    box.innerHTML = html;
  }

  function renderHelp() {
    $('help').textContent = 'Haut et Bas : choisir · OK : lancer · Gauche et Droite : ' + PAGE + ' lignes plus haut ou plus bas · Retour : revenir à TizenBrew' +
      (st.shown.length ? ' · ligne ' + (st.row + 1) + ' sur ' + st.shown.length : '');
  }

  function render() {
    renderStats();
    renderTools();
    renderList();
    renderHelp();
  }

  /* ---------- Données ---------- */

  function applyFilter() {
    var list = (st.apps && st.apps.list) || [];
    st.shown = st.showAll ? list : list.filter(function (a) { return a.show; });
    if (st.row >= st.shown.length) { st.row = Math.max(0, st.shown.length - 1); }
  }

  function loadApps(refresh) {
    request('GET', '/applis' + (refresh ? '?recharger=1' : ''), null, function (err, data) {
      if (err) { return showMessage(err); }
      st.apps = data;
      applyFilter();
      render();
    });
  }

  // Le service garde les résultats : ils réapparaissent quand on revient d'une appli.
  function loadState(done) {
    request('GET', '/etat', null, function (err, data) {
      if (!err && data) {
        st.info.lan = data.lan;
        st.info.timings = data.timings;
        for (var i = 0; i < data.launches.length; i++) {
          var l = data.launches[i];
          if (l.ok !== null && !st.results[l.id]) { st.results[l.id] = { ok: l.ok, ms: l.ms, error: l.error }; }
        }
      }
      if (done) { done(); }
    });
  }

  /* ---------- Actions ---------- */

  function launchFocused() {
    var app = st.shown[st.row];
    if (!app || st.busy) { return; }
    st.busy = true;
    st.results[app.id] = { pending: true };
    request('POST', '/lancer', { id: app.id }, function (err, data) {
      st.busy = false;
      st.results[app.id] = err ? { ok: false, error: err } : { ok: !!data.ok, ms: data.ms, error: data.error };
      render();
    });
  }

  function toggleAll() {
    st.showAll = !st.showAll;
    st.row = 0;
    st.top = 0;
    applyFilter();
  }

  function toggleLan() {
    var open = !!(st.info && st.info.lan && st.info.lan.open);
    request('POST', open ? '/reseau/fermer' : '/reseau/ouvrir', {}, function (err, data) {
      if (err) { return showMessage(err); }
      st.info.lan = data.lan;
      render();
    });
  }

  document.addEventListener('keydown', function (e) {
    var code = e.keyCode;
    if (code === KEY.BACK || code === KEY.ESCAPE) {
      e.preventDefault();
      history.back();
      return;
    }
    if (st.zone === 'list' && !st.shown.length) { st.zone = 'tools'; }
    if (st.zone === 'tools') {
      var count = tools().length;
      if (code === KEY.LEFT) { st.tool = Math.max(0, st.tool - 1); }
      else if (code === KEY.RIGHT) { st.tool = Math.min(count - 1, st.tool + 1); }
      else if (code === KEY.DOWN) { if (st.shown.length) { st.zone = 'list'; } }
      else if (code === KEY.ENTER) { tools()[st.tool].run(); }
      else { return; }
    } else {
      if (code === KEY.UP) { if (st.row === 0) { st.zone = 'tools'; } else { st.row -= 1; } }
      else if (code === KEY.DOWN) { st.row = Math.min(st.shown.length - 1, st.row + 1); }
      else if (code === KEY.LEFT) { st.row = Math.max(0, st.row - PAGE); }
      else if (code === KEY.RIGHT) { st.row = Math.min(st.shown.length - 1, st.row + PAGE); }
      else if (code === KEY.ENTER) { launchFocused(); }
      else { return; }
    }
    e.preventDefault();
    render();
  });

  function start() {
    $('version').textContent = 'v' + VERSION;
    render();
    request('GET', '/session?nav=' + navigationStart + '&ready=' + readyAt, null, function (err, data) {
      if (err) {
        return showMessage(err + " Relance le module depuis TizenBrew ; si ça continue, redémarre la TV.");
      }
      st.token = data.token;
      st.info = data;
      if (data.version !== VERSION) {
        showMessage('Le service en marche est en version ' + data.version + ' et la page en version ' + VERSION +
          ' : redémarre la TV pour charger le bon service.');
      }
      render();
      loadState(function () { loadApps(false); });
      setInterval(function () { loadState(render); }, 15000);
    });
  }

  start();
})();
</script>
</body>
</html>
